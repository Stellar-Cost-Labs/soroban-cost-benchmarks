<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 200" width="820" height="200" role="img" aria-label="soroban-cost-benchmarks — storage-rent forecasting and inline PR cost comments">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#141a2e"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7aa2f7"/>
      <stop offset="50%" stop-color="#9ece6a"/>
      <stop offset="100%" stop-color="#e0af68"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="820" height="200" rx="18" fill="url(#bg)"/>
  <rect x="0" y="0" width="820" height="200" rx="18" fill="none" stroke="#2a3350" stroke-width="2"/>
  <rect x="0" y="196" width="820" height="4" rx="2" fill="url(#rule)"/>

  <!-- Three storage tiers, drawn as stacked capacity bars -->
  <g transform="translate(46 52)">
    <rect x="0" y="0" width="26" height="14" rx="3" fill="#7aa2f7"/>
    <rect x="0" y="24" width="52" height="14" rx="3" fill="#9ece6a"/>
    <rect x="0" y="48" width="78" height="14" rx="3" fill="#e0af68"/>
    <text x="0" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#5c6a94">instance · persistent · temporary</text>
  </g>

  <text x="176" y="82" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#c0caf5">soroban-cost-benchmarks</text>
  <text x="176" y="112" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#8b98c4">Storage-rent forecasting, WASM metrics, and an inline PR cost bot</text>
  <text x="176" y="140" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#6b7aa8">built on soroban-cost-estimator</text>
</svg>
