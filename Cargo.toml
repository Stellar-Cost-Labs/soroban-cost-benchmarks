[package]
name = "soroban-cost-benchmarks"
version = "0.1.0"
edition = "2024"
description = "Soroban storage-rent forecasting, WASM metrics capture, and CI PR comment bot — built on soroban-cost-estimator"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Stellar-Cost-Labs/soroban-cost-benchmarks"
rust-version = "1.85"
default-run = "soroban-cost-benchmarks"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin)'] }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cargo_common_metadata = { level = "allow", priority = 1 }
doc_markdown = { level = "allow", priority = 1 }
missing_panics_doc = { level = "allow", priority = 1 }
missing_errors_doc = { level = "allow", priority = 1 }
module_name_repetitions = { level = "allow", priority = 1 }
similar_names = { level = "allow", priority = 1 }
cast_lossless = { level = "allow", priority = 1 }
cast_possible_truncation = { level = "allow", priority = 1 }
cast_sign_loss = { level = "allow", priority = 1 }
must_use_candidate = { level = "allow", priority = 1 }
significant_drop_tightening = { level = "allow", priority = 1 }
struct_excessive_bools = { level = "allow", priority = 1 }
ref_option = { level = "allow", priority = 1 }
format_push_string = { level = "allow", priority = 1 }
uninlined_format_args = { level = "allow", priority = 1 }
redundant_closure_for_method_calls = { level = "allow", priority = 1 }
separated_literal_suffix = { level = "allow", priority = 1 }
cast_precision_loss = { level = "allow", priority = 1 }
items_after_statements = { level = "allow", priority = 1 }
wildcard_imports = { level = "allow", priority = 1 }
doc_lazy_continuation = { level = "allow", priority = 1 }
needless_borrow = { level = "allow", priority = 1 }
case_sensitive_file_extension_comparisons = { level = "allow", priority = 1 }
cast_possible_wrap = { level = "allow", priority = 1 }
redundant_closure = { level = "allow", priority = 1 }
single_match_else = { level = "allow", priority = 1 }
map_unwrap_or = { level = "allow", priority = 1 }
useless_format = { level = "allow", priority = 1 }
too_many_arguments = { level = "allow", priority = 1 }

[dependencies]
# Core dependency — wraps RPC simulation, config snapshotting, WASM parsing
soroban-cost-estimator = "0.1.0"

# CLI
clap = { version = "4.6.4", features = ["derive"] }

# Async runtime
tokio = { version = "1.53.1", features = ["full"] }

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
csv = "1.3"

# WASM parsing (re-exported from soroban-cost-estimator, but we need it for standalone analysis)
wasmparser = "0.254.0"

# XDR types
stellar-xdr = "27.0.0"
# Base64 for building LedgerKeys for settings soroban-cost-estimator does not model
base64 = "0.23"

# Table formatting
comfy-table = "7.2.2"

# Hashing
sha2 = "0.11.0"
hex = "0.4.3"

# Timestamps
chrono = { version = "0.4.45", features = ["serde"] }

# Error handling
thiserror = "2.0.19"

# Structured tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# GitHub API for PR comments.
#
# octocrab's default features select `rustls-ring`, while
# `soroban-cost-estimator`'s reqwest pulls `rustls` in with `aws-lc-rs`. With
# both providers enabled, rustls 0.23 cannot pick a process-level
# `CryptoProvider`, and octocrab panics on its first HTTPS call
# ("Could not automatically determine the process-level CryptoProvider from
# Rustls crate features"). Selecting aws-lc-rs here leaves exactly one provider
# in the graph, matching the estimator's; the rest of octocrab's defaults are
# restated so nothing else is dropped.
octocrab = { version = "0.44", default-features = false, features = [
    "default-client",
    "follow-redirect",
    "retry",
    "rustls",
    "rustls-aws-lc-rs",
    "timeout",
    "tracing",
] }

[dev-dependencies]
insta = "1.40.0"
wat = "1.220.0"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

[[bin]]
name = "soroban-cost-benchmarks"
path = "src/main.rs"
